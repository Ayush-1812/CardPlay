version: "2"
sql:
  - engine: postgresql
    schema:
      - db/migrations/000001_foundation.up.sql
      - db/migrations/000002_accounts.up.sql
      - db/migrations/000003_room_bans.up.sql
      - db/migrations/000004_room_presence.up.sql
      - db/migrations/000005_outbox_notify.up.sql
      - db/migrations/000006_login_devices.up.sql
      - db/migrations/000007_match_runtime.up.sql
      - db/migrations/000008_turn_timeout.up.sql
      - db/migrations/000009_guests_and_temporary_rooms.up.sql
      - db/migrations/000010_socket_tickets.up.sql
    queries: db/queries
    gen:
      go:
        package: store
        out: internal/store
        sql_package: pgx/v5
        emit_json_tags: true
        emit_empty_slices: true
        emit_interface: true
        overrides:
          - db_type: uuid
            go_type: string
          - db_type: uuid
            nullable: true
            go_type:
              type: string
              pointer: true
          - db_type: timestamptz
            go_type:
              import: time
              type: Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
