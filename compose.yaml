name: cardplay
services:
  db:
    image: postgres:18.5-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run node scripts/setup.mjs first}
      POSTGRES_DB: ${POSTGRES_DB:?Run setup first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup first}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  mail:
    image: axllent/mailpit:v1.29.2
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
  migrate:
    build: .
    image: cardplay-api:local
    command: ["migrate"]
    environment: &api-env
      APP_ENV: development
      HTTP_ADDR: :8080
      APP_ORIGIN: http://localhost:3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      SMTP_ADDR: mail:1025
      MAIL_FROM: hello@cardplay.test
    depends_on:
      db: { condition: service_healthy }
  api:
    image: cardplay-api:local
    build: .
    environment: *api-env
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      mail: { condition: service_started }
    healthcheck:
      test: ["CMD", "/cardplay", "health"]
      interval: 5s
      timeout: 3s
      retries: 10
  web:
    build: ./web
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: { condition: service_healthy }
  seed:
    profiles: ["tools"]
    image: cardplay-api:local
    command: ["seed"]
    environment:
      <<: *api-env
      SEED_PASSWORD: ${SEED_PASSWORD:?Run setup first}
    depends_on:
      migrate: { condition: service_completed_successfully }
  sqlc:
    profiles: ["tools"]
    image: sqlc/sqlc:1.31.1
    working_dir: /src
    volumes: [".:/src"]
    command: ["generate"]
volumes:
  pgdata:
