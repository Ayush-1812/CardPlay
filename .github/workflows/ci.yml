name: CardPlay CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: cardplay
          POSTGRES_PASSWORD: test_password_only
          POSTGRES_DB: cardplay_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cardplay -d cardplay_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://cardplay:test_password_only@127.0.0.1:5432/cardplay_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal db)"
      - name: Static checks
        run: go vet ./cmd/... ./internal/... ./db/...
      - name: Unit and database integration tests
        run: go test ./cmd/... ./internal/... ./db/...
      - name: Build
        run: go build ./cmd/cardplay
      - name: Check sqlc output
        run: |
          docker run --rm -v "$PWD:/src" -w /src sqlc/sqlc:1.31.1 generate
          git diff --exit-code -- internal/store
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
