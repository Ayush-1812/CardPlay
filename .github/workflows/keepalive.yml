# Keeps the API awake on a host that parks idle services.
#
# A free Render service sleeps after about 15 minutes with no traffic, and the
# next visitor waits up to a minute for it to start. A small request every ten
# minutes keeps it running, so the site is immediate whenever somebody opens
# it.
#
# Two things to know before relying on this:
#   * An always-awake service uses roughly 730 of the 750 free instance-hours
#     Render allows per month, so keep ONE free service in the account. A
#     second one exhausts the allowance and both are suspended mid-month.
#   * GitHub pauses scheduled workflows in a repository with no activity for
#     60 days, and runs them late when the shared runners are busy. The client
#     also waits out a cold start, so a missed ping is a slow first load, not
#     an error.
#
# Set the repository variable API_HEALTH_URL to the API's health endpoint,
# for example https://cardplay.onrender.com/healthz. Without it this does
# nothing, so a fork never pings somebody else's server.
name: Keep the API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the API
        env:
          URL: ${{ vars.API_HEALTH_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "API_HEALTH_URL is not set; nothing to ping."
            exit 0
          fi
          # A sleeping service answers only once it has started, so allow a
          # full cold start before calling it a failure, and try twice.
          for attempt in 1 2; do
            code=$(curl -sS -o /dev/null -m 90 -w "%{http_code}" "$URL" || echo "000")
            echo "attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "::warning::The API did not answer with 200; it may be suspended or out of free hours."
          exit 1
