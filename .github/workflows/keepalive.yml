# Keeps the API awake on a host that parks idle services.
#
# A free Render service sleeps after about 15 minutes with no traffic, and the
# next visitor waits about a minute for it to start. A readiness request every
# five minutes reduces idle starts and detects database/notification failures.
#
# Two things to know before relying on this:
#   * An always-awake service uses up to 744 of the 750 free instance-hours
#     Render allows per month, so keep ONE free service in the workspace. A
#     second one exhausts the allowance and both are suspended mid-month.
#   * GitHub pauses scheduled workflows in a repository with no activity for
#     60 days, and runs them late when the shared runners are busy. The client
#     allows 90 seconds for a cold start, but cannot overcome a suspension.
#
# The main repository defaults to its Render readiness endpoint. Forks must
# set API_HEALTH_URL explicitly. Never monitor the Vercel homepage for this:
# it can return 200 while the backend is unavailable.
name: Keep the API awake

on:
  schedule:
    - cron: "3-58/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the API
        env:
          URL: ${{ vars.API_HEALTH_URL || (github.repository == 'Ayush-1812/CardPlay' && 'https://cardplay.onrender.com/readyz') || '' }}
        run: |
          if [ -z "$URL" ]; then
            echo "API_HEALTH_URL is not set; nothing to ping."
            exit 0
          fi
          case "$URL" in
            https://*/readyz|https://*/healthz) ;;
            *)
              echo "::error::API_HEALTH_URL must be an HTTPS backend /readyz or /healthz URL, not the frontend homepage."
              exit 1
              ;;
          esac
          # A sleeping service answers only once it has started, so allow a
          # full cold start before calling it a failure, and try twice.
          for attempt in 1 2; do
            code=$(curl -sS -o /dev/null --connect-timeout 10 -m 90 -w "%{http_code}" "$URL") || code=000
            echo "attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            if [ "$code" = "429" ] || [ "$code" = "403" ]; then
              echo "::error::The host refused the request (HTTP $code). Check Render Events and usage; more pings will not resolve this refusal."
              exit 1
            fi
            sleep 15
          done
          echo "::warning::The API did not answer with 200; it may be suspended or out of free hours."
          exit 1
